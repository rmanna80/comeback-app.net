<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password: Comeback</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<meta name="theme-color" content="#0B0D0F">
<style>
:root { --inkSoft: var(--muted); --inkFaint: var(--subtle); }
.success p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0; }
.success p:first-child { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 26px !important; text-transform: uppercase; color: var(--text); margin-bottom: 10px; }
</style>
</head>
<body class="app-page">
<div class="wrap">
  <p class="kicker">Comeback</p>
  <h1 class="disp">Set a new password</h1>

  <div class="card tabbed" id="formCard">
    <div id="checking">
      <p style="text-align:center; color: var(--inkSoft); font-size: 14px;">Checking your reset link…</p>
    </div>
    <div id="form" class="hidden">
      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="At least 6 characters" />
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Type it again" />
      <button id="submitBtn" onclick="submitReset()">Set new password</button>
      <div class="err hidden" id="errMsg"></div>
    </div>
    <div id="invalidLink" class="hidden">
      <p style="text-align:center; color: var(--inkSoft); font-size: 14px; line-height: 1.6;">
        This reset link is invalid or has expired. Go back to the app, tap "Forgot password?" again, and use the newest email.
      </p>
    </div>
  </div>

  <div class="card tabbed success hidden" id="successCard">
    <p style="font-size: 17px; font-weight: 800; margin: 0 0 10px;">Password updated</p>
    <p>Go back to the Comeback app and sign in with your new password — your data is exactly where you left it.</p>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://kwuxxiyilhnlwxpfdhse.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tGpURzDuVlA0Stk-Ux9pHA_ve_AeCl4';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Supabase's recovery link puts the token in the URL fragment and
  // the client library picks it up automatically on load (this is
  // its own standard, documented behavior for password-recovery
  // links) — by the time onAuthStateChange fires with PASSWORD_RECOVERY,
  // there's a valid, usable session for updateUser() to act on.
  let hasRecoverySession = false;

  client.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) {
      hasRecoverySession = true;
      document.getElementById('checking').classList.add('hidden');
      document.getElementById('form').classList.remove('hidden');
    }
  });

  // If the event hasn't fired shortly after load, the link itself
  // was invalid or already used — show that plainly rather than
  // leave "Checking your reset link…" up forever.
  setTimeout(() => {
    if (!hasRecoverySession) {
      document.getElementById('checking').classList.add('hidden');
      document.getElementById('invalidLink').classList.remove('hidden');
    }
  }, 3000);

  async function submitReset() {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    const errEl = document.getElementById('errMsg');
    const btn = document.getElementById('submitBtn');
    errEl.classList.add('hidden');

    if (pw1.length < 6) {
      errEl.textContent = 'Password needs to be at least 6 characters.';
      errEl.classList.remove('hidden');
      return;
    }
    if (pw1 !== pw2) {
      errEl.textContent = 'Those two passwords don\u2019t match.';
      errEl.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating…';
    try {
      const { error } = await client.auth.updateUser({ password: pw1 });
      if (error) throw error;
      document.getElementById('formCard').classList.add('hidden');
      document.getElementById('successCard').classList.remove('hidden');
    } catch (e) {
      errEl.textContent = e.message || 'Could not update the password. The link may have expired.';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Set new password';
    }
  }
</script>
</body>
</html>
