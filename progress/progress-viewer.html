<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress: Comeback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<meta name="theme-color" content="#0B0D0F">
<style>
:root { --inkSoft: var(--muted); --inkFaint: var(--subtle); }
.app-page input#pin { font-size: 28px; letter-spacing: 10px; text-align: center; font-family: var(--display); font-weight: 700; }
.name { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 30px; text-transform: uppercase; line-height: 1; margin: 0 0 6px; }
.sub { color: var(--muted); font-size: 15px; margin: 0 0 20px; }
.stats { display: flex; gap: 10px; margin-bottom: 8px; }
.stat { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px; text-align: center; }
.stat .num { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 40px; line-height: 1; color: var(--accent); }
.stat .label { font-family: var(--display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-top: 4px; }
.section-title { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pitch); margin: 22px 0 8px; }
.section-title::before { content: ''; width: 4px; height: 13px; background: currentColor; transform: skewX(-20deg); }
.milestone { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.m-title { font-weight: 600; text-transform: capitalize; }
.m-date { color: var(--subtle); font-size: 13px; margin-top: 2px; }
.conf { font-family: var(--display); font-weight: 700; font-style: italic; color: var(--pitch); font-size: 18px; }
.footer-note { color: var(--subtle); font-size: 13px; margin: 18px 0 0; line-height: 1.5; }
</style>
</head>
<body class="app-page">
<div class="wrap">
  <p class="kicker">Comeback</p>
  <h1 class="disp">Injury recovery progress</h1>

  <div class="card tabbed" id="pinCard">
    <label for="pin">Enter the 4-digit PIN</label>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off" />
    <button id="submitBtn" onclick="submitPin()">View progress</button>
    <div class="err hidden" id="errMsg"></div>
  </div>

  <div class="card tabbed hidden" id="dataCard">
    <p class="name" id="dName"></p>
    <p class="sub" id="dSub"></p>
    <div class="stats">
      <div class="stat"><div class="num" id="dDays">—</div><div class="label">days in</div></div>
      <div class="stat"><div class="num" id="dStreak">—</div><div class="label">day streak</div></div>
    </div>
    <div class="section-title">Milestones</div>
    <div id="milestoneList"></div>
    <p class="footer-note">Notes and reflections stay private — this view only ever shows dates and confidence ratings, never written entries.</p>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://kwuxxiyilhnlwxpfdhse.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tGpURzDuVlA0Stk-Ux9pHA_ve_AeCl4';

  function getToken() {
    return new URLSearchParams(window.location.search).get('token') || '';
  }

  // Milestone data (id, confidence) ultimately comes from the app's
  // own locally-written data blob, with nothing server-side
  // constraining what it can contain — never trust it enough to
  // interpolate it into innerHTML unescaped, even though in normal
  // use it's always a plain milestone name and a 0-10 number.
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  async function submitPin() {
    const pin = document.getElementById('pin').value.trim();
    const errEl = document.getElementById('errMsg');
    const btn = document.getElementById('submitBtn');
    errEl.classList.add('hidden');

    if (!/^\d{4}$/.test(pin)) {
      errEl.textContent = 'Enter exactly 4 digits.';
      errEl.classList.remove('hidden');
      return;
    }
    const token = getToken();
    if (!token) {
      errEl.textContent = 'This link is missing its token — ask for a fresh link.';
      errEl.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Checking…';
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/view-shared-progress`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ token, pin }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      renderData(data);
    } catch (e) {
      errEl.textContent = e.message || 'Something went wrong.';
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'View progress';
    }
  }

  function renderData(d) {
    document.getElementById('pinCard').classList.add('hidden');
    const card = document.getElementById('dataCard');
    card.classList.remove('hidden');

    document.getElementById('dName').textContent = d.displayName ? `${d.displayName}'s comeback` : 'Comeback progress';
    const subParts = [d.sport, d.injuryName].filter(Boolean);
    document.getElementById('dSub').textContent = subParts.join(' · ') || '—';
    document.getElementById('dDays').textContent = d.daysIn != null ? d.daysIn : '—';
    document.getElementById('dStreak').textContent = d.streak != null ? d.streak : '—';

    const list = document.getElementById('milestoneList');
    list.innerHTML = '';
    const unlocked = (d.milestones || []).filter((m) => m.date).sort((a, b) => (a.date < b.date ? -1 : 1));
    if (!unlocked.length) {
      list.innerHTML = '<p style="color: var(--inkFaint); font-size: 13px;">No milestones unlocked yet.</p>';
      return;
    }
    unlocked.forEach((m) => {
      const row = document.createElement('div');
      row.className = 'milestone';
      const dateStr = new Date(m.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      row.innerHTML = `
        <div>
          <div class="m-title">${escapeHtml(m.id.replace(/([A-Z])/g, ' $1'))}</div>
          <div class="m-date">${dateStr}</div>
        </div>
        ${m.confidence != null ? `<div class="conf">${escapeHtml(m.confidence)}/10</div>` : ''}
      `;
      list.appendChild(row);
    });
  }

  document.getElementById('pin').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitPin();
  });
</script>
</body>
</html>
